name: Build and Release Obsidian Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare package
        run: |
          version="$(node -p "require('./manifest.json').version")"
          package_dir="dist/messenger-callout"
          (cd dist && zip -r "messenger-callout-$version.zip" messenger-callout)
          cp "$package_dir/manifest.json" dist/manifest.json
          cp "$package_dir/main.js" dist/main.js
          cp "$package_dir/styles.css" dist/styles.css
      - uses: actions/upload-artifact@v4
        with:
          name: messenger-callout-plugin
          path: dist/
          retention-days: 7
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/manifest.json
            dist/main.js
            dist/styles.css
